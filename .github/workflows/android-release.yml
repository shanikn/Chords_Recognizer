# Builds the Android app's two release builds (arm64, signed) from a fresh clone: the C++
# core's third-party code (tools/fetch_deps.py), the models and tables
# (tools/prepare_assets.py), then Gradle:
#   ChordChart.apk           the sideload build (with YouTube and Spotify links); pushing a
#                            tag v* (or Run workflow on main with a release tag such as
#                            v0.3.0, which creates the tag) also publishes it as a GitHub
#                            release, so it can be downloaded straight onto a phone
#   ChordChart-play.aab      the Google Play build (no links), to upload in the Play Console
# Both are attached to the run.
#
# Signing: with the four CHORDCHART_* secrets set (see android/README.md), every build is
# signed with your own key and installs over the previous one. Without them it is signed
# with the runner's throwaway debug key: installable, but not over an earlier build.
# Pull request builds never see the key: they run the PR's own Gradle scripts (and the
# PR's copy of this file), which could otherwise read it. The secrets live in the
# "release" environment, which only main and v* tags may use, and PR runs don't enter it;
# they are always signed with the throwaway debug key.
name: Android release APK and Play bundle

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["android/**", "chordchart/**", "uv.lock", ".github/workflows/android-release.yml"]
  pull_request:
    paths: ["android/**", "chordchart/**", "uv.lock", ".github/workflows/android-release.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release with this new tag, such as v0.3.0 (main only; empty: just build)"
        required: false
        default: ""

permissions:
  contents: write  # publish the release on a tag

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: ${{ github.event_name != 'pull_request' && 'release' || '' }}
    env:
      # the release this run publishes: the pushed tag, or Run workflow's input; empty: none
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (github.event_name == 'workflow_dispatch' && inputs.release || '') }}
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space (PyTorch and the NDK need ~15 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Android SDK licences (Gradle installs the platform, NDK and CMake it pins)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Python pipeline (madmom, for exporting the models)
        run: uv sync

      - name: Third-party code for the C++ core
        run: uv run python android/tools/fetch_deps.py

      - name: Models and tables
        run: uv run --with onnx --with onnxscript python android/tools/prepare_assets.py

      - name: Signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.CHORDCHART_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/release.jks
            echo "CHORDCHART_KEYSTORE_FILE=release.jks" >> "$GITHUB_ENV"
          elif [ -n "$RELEASE_TAG" ]; then
            echo "::error::A release needs the CHORDCHART_KEYSTORE_* secrets in the release environment (android/README.md)."
            exit 1
          else
            echo "::warning::No CHORDCHART_KEYSTORE_BASE64 secret: signing with a throwaway debug key."
          fi

      - uses: gradle/actions/setup-gradle@v5

      - name: Build the release APK and the Play bundle
        working-directory: android
        env:
          CHORDCHART_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.CHORDCHART_KEYSTORE_PASSWORD || '' }}
          CHORDCHART_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.CHORDCHART_KEY_ALIAS || '' }}
          CHORDCHART_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.CHORDCHART_KEY_PASSWORD || '' }}
          # a tag v0.3.0 -> versionName 0.3.0
          VERSION_NAME: ${{ env.RELEASE_TAG }}
        run: |
          bash gradlew assembleFullRelease bundlePlayRelease -PversionCode=${{ github.run_number }} ${VERSION_NAME:+-PversionName=${VERSION_NAME#v}}
          cp app/build/outputs/apk/full/release/app-full-release.apk ../ChordChart.apk
          cp app/build/outputs/bundle/playRelease/app-play-release.aab ../ChordChart-play.aab
          ls -l ../ChordChart.apk ../ChordChart-play.aab
          rm -f release.jks

      - name: Native libraries are 16 KB-aligned (Google Play requires it)
        run: python3 android/tools/check_page_size.py ChordChart-play.aab

      - uses: actions/upload-artifact@v4
        with:
          name: ChordChart-apk
          path: ChordChart.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ChordChart-play-aab
          path: ChordChart-play.aab

      - name: Publish the release (a v* tag, or Run workflow with a release tag)
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::Release tags look like v0.3.0, not '$RELEASE_TAG'."; exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Run the workflow on main to publish a release."; exit 1
          fi
          # an existing tag must name this build's commit, or the APK wouldn't match its source
          tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$RELEASE_TAG" --jq .sha 2>/dev/null || true)
          if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::$RELEASE_TAG already exists, on $tagged, not this build's $GITHUB_SHA. Pick a new tag."; exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # made on github.com (Releases -> Draft a new release): add the APK, keeping one already there
            if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -qx ChordChart.apk; then
              echo "::notice::$RELEASE_TAG already has ChordChart.apk; left as is."
            else
              gh release upload "$RELEASE_TAG" ChordChart.apk
            fi
          else
            # creates the tag on this commit when it doesn't exist yet
            gh release create "$RELEASE_TAG" ChordChart.apk --target "$GITHUB_SHA" --title "ChordChart $RELEASE_TAG" --generate-notes
          fi
