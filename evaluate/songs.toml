# Evaluation songs: the Isophonics "Reference Annotations: The Beatles" (Centre for
# Digital Music, Queen Mary University of London: chords by C. Harte, beats by
# M. E. P. Davies; http://isophonics.net/content/reference-annotations-beatles).
# The annotations are downloaded and checked by evaluate/data.py, never committed.
#
# `path`: the song inside the archive's chordlab/ and beat/ folders (The Beatles/...).
# `link`: the official 2009 stereo remaster on The Beatles' YouTube channel. The
#   annotations were made on the original CD masters; the 2009 remasters have the same
#   edits and lengths, and evaluate/align.py finds the time offset. Later remixes
#   (2019 Abbey Road, 2022 Revolver, 2015 "1") are different mixes, so songs only
#   available that way officially aren't used.

