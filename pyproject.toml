[project]
name = "chordchart"
version = "1.0.0"
description = "Detect the chords of a song and print a bar-aligned chord chart."
requires-python = ">=3.12,<3.14"
dependencies = [
    # Pinned: main has not moved since this commit (spec §2.1). PyPI 0.16.1 does not build.
    "madmom @ git+https://github.com/CPJKU/madmom@27f032e8947204902c675e5e341a3faf5dc86dae",
    # Capped: madmom calls np.maximum(x, 0, out) positionally, deprecated in NumPy 2.5
    # and due to become an error. See spec §2.1 for the two ways to lift the cap.
    "numpy>=2.0,<2.6",
    # `deno` ships a JavaScript runtime, which YouTube extraction needs, so nothing
    # depends on a system deno/node. YouTube breaks often; to upgrade:
    #   uv lock --upgrade-package yt-dlp && uv sync
    "yt-dlp[default,deno]>=2026.8.19",
    # madmom uses OpenCV for its CNN convolutions when installed (cv2.filter2D);
    # without it, a Python loop over every channel pair. Same maths, much faster.
    "opencv-python-headless>=4.12",
    # `chordchart serve`: local web UI
    "fastapi>=0.141",
    "uvicorn>=0.54",
    # Notes transcription (chordchart/notes): Demucs splits the song into instrument
    # stems, basic-pitch turns one stem into notes. basic-pitch runs its ONNX model
    # through onnxruntime; see [tool.uv] below for why tensorflow is left out.
    "demucs>=4.1.0",
    "basic-pitch>=0.4.0",
    # The beat tracker (chordchart/beat_this.py): Beat This! on onnxruntime, with the
    # audio resampled to 22.05 kHz by soxr. Both builds need them, not just notes.
    "onnxruntime>=1.20",
    "soxr>=0.5",
]

[project.scripts]
chordchart = "chordchart.cli:main"

[dependency-groups]
dev = ["httpx2>=2.13", "pytest>=8", "ruff>=0.6", "scipy>=1.13"]
# Windows desktop app (packaging/): the window, and the build tool.
desktop = ["pywebview>=6.2", "pyinstaller>=6.22"]

[tool.uv]
# basic-pitch 0.4.0 requires tensorflow<2.15.1, which has no Python 3.12 build, so it
# can't be installed as published. It only needs one model runtime and picks onnxruntime
# when tensorflow is absent, so tensorflow is never installed.
# It also pins resampy<0.4.3, whose versions import pkg_resources, which current
# setuptools no longer ships; 0.4.3 has the same API without that import.
override-dependencies = ["tensorflow; sys_platform == 'never'", "resampy>=0.4.3"]
# The lockfile covers Windows and Linux only. On macOS, basic-pitch requires
# tensorflow-macos<2.15.1 (no Python 3.12 build) and demucs pins numpy<2 on Intel Macs.
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["chordchart"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: runs madmom models on generated audio (seconds per test)",
    "accuracy: needs locally stored annotated audio",
    "network: talks to YouTube; run explicitly with -m network",
    "browser: drives the page in headless Chrome; uv run --with playwright pytest -m browser",
]
addopts = "-rs -m 'not slow and not accuracy and not network and not browser'"
# Any warning raised from madmom code fails the test run (spec §2.1), except the one
# known deprecation below. Later entries take precedence over earlier ones.
filterwarnings = [
    "error::Warning:madmom",
    "ignore:Passing more than 2 positional arguments to np.maximum:DeprecationWarning:madmom.ml.nn.activations",
]

[tool.ruff]
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
